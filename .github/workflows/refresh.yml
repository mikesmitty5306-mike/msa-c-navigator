name: Refresh data
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      send_test_push:
        description: Send ONE test notification after a successful Pages deployment
        type: boolean
        default: false
      refresh_data:
        description: Refresh research APIs before deploying (otherwise use the committed export)
        type: boolean
        default: false
# Every job below declares only the permissions it actually needs.
permissions: {}
concurrency:
  group: msac-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      # This is the only job that commits public-data/ back to main.
      contents: write
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r tools/requirements-static.txt
      - name: Restore working research database and private delivery ledger
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/msac.sqlite3
          key: research-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: research-v2-
      - name: Check, refresh when due, recompute, export and notify
        id: refresh
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        timeout-minutes: 300
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL || vars.NCBI_EMAIL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || vars.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          # Legacy compatibility only; configure PUSH_SUBSCRIPTION for new setups.
          PUSH_SUBSCRIPTIONS: ${{ !secrets.PUSH_SUBSCRIPTION && secrets.PUSH_SUBSCRIPTIONS || '' }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        shell: bash
        run: |
          if [ -n "$FORCE_BUILD" ]; then
            python -m msac refresh-scheduled --force
          else
            python -m msac refresh-scheduled
          fi
      - name: Recover and checkpoint committed WAL data before cache save
        if: always() && steps.refresh.outcome != 'skipped'
        id: checkpoint
        run: python tools/checkpoint_research.py
      - name: Save SQLite checkpoints and delivery ledger, including failed refreshes
        if: always() && steps.checkpoint.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/msac.sqlite3
          key: research-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Allow release only after successful preceding steps
        id: release
        if: success()
        env:
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_REQUESTED: ${{ inputs.refresh_data == true && 'true' || 'false' }}
          REFRESH_DEPLOY: ${{ steps.refresh.outputs.deploy }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = 'schedule' ] || [ "$REFRESH_REQUESTED" = 'true' ]; then
            echo "deploy=${REFRESH_DEPLOY:-false}" >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate committed export and publish only the public VAPID key
        if: success() && steps.release.outputs.deploy == 'true'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || vars.VAPID_PUBLIC_KEY }}
        run: python tools/prepare_deployment.py
      - name: Focused deployment and push checks (no browsers)
        if: success() && steps.release.outputs.deploy == 'true'
        run: python -m pytest -q tests/test_deployment.py tests/test_push_static.py
      - name: Assemble only the validated public export
        if: success() && steps.release.outputs.deploy == 'true'
        run: python tools/assemble_site.py
      - name: Commit changed public data only
        if: success() && steps.release.outputs.deploy == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public-data/
          if ! git diff --cached --quiet -- public-data/; then
            git commit --only -m 'Refresh public research data' -- public-data/
            git push
          fi
      - name: Upload Pages artifact
        if: success() && steps.release.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  test-push:
    needs: [build, deploy]
    if: github.event_name == 'workflow_dispatch' && inputs.send_test_push == true && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r tools/requirements-static.txt
      - name: Send exactly one requested test notification
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || vars.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: python -m msac test-push
